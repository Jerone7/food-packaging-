name: ai_packaging_recommender
description: "AI-powered Packaging Recommender Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & State Management
  http: ^1.2.1
  provider: ^6.1.2

  # UI, Icons, Fonts & Charts
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  lucide_icons: ^0.257.0

  # PDF & Print Export
  pdf: ^3.10.8
  printing: ^5.13.1

  # Local Storage & Persistence
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/

